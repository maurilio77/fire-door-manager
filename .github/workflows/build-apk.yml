name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - principale

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          unzip -o "FIRE-DOOR-MANAGER-APK (1).zip" -d extracted

      - name: Find Android project
        run: |
          PROJECT_DIR=$(find extracted -type f -name settings.gradle -printf '%h\n' | head -1)
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Progetto trovato: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FIRE-DOOR-MANAGER-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
