name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract project
        run: |
          mkdir -p extracted
          unzip -o "FIRE-DOOR-MANAGER-APK (1).zip" -d extracted

      - name: Show extracted files
        run: |
          echo "CONTENUTO DELLO ZIP"
          find extracted -maxdepth 5 -type f

      - name: Find Android project
        run: |
          PROJECT_DIR=$(find extracted -type f -name settings.gradle -printf '%h\n' | head -1)
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERRORE: progetto Android non trovato"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FIRE-DOOR-MANAGER-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
