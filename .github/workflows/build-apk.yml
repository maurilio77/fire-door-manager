name: Crea APK per Android

on:
  push:
    branches:
      - principale
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Configura Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configura Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verifica progetto
        run: |
          ls -la
          ls -la fdm_android
          ls -la fdm_android/app

      - name: Compila APK
        run: gradle -p fdm_android assembleDebug

      - name: Salva APK
        uses: actions/upload-artifact@v4
        with:
          name: FIRE-DOOR-MANAGER-APK
          path: fdm_android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
