name: Build Fire Door Manager V7 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract V7 project
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*V7*CLOUD*PROGETTO*.zip' | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "ERRORE: ZIP V7 non trovato"
            ls -la
            exit 1
          fi
          mkdir extracted
          unzip -q "$ZIP_FILE" -d extracted
          PROJECT_DIR=$(find extracted -name settings.gradle -print -quit | xargs dirname)
          if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "ERRORE: progetto Android V7 non trovato"
            find extracted -maxdepth 4 -type f | head -100
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FIRE-DOOR-MANAGER-V7-APK
          path: extracted/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
