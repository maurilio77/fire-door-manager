name: Build Fire Door Manager APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: unzip -o fire_door_manager_v5_android_build_da_telefono.zip

      - name: Build APK
        run: cd fdm_android && gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: FIRE-DOOR-MANAGER-APK
          path: fdm_android/app/build/outputs/apk/debug/app-debug.apk
