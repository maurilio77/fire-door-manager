name: Build Fire Door Manager APK

on:
workflow_dispatch:
push:
branches:
- main
- master

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.9'

  - name: Extract Android project
    run: |
      unzip -o fire_door_manager_v5_android_build_da_telefono.zip
      ls -la fdm_android

  - name: Build APK
    run: gradle -p fdm_android assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: FIRE-DOOR-MANAGER-APK
      path: fdm_android/app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
