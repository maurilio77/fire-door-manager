name: Build APK per Android

on:
push:
branches:
- principale
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Configura Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Configura Gradle
    uses: gradle/actions/setup-gradle@v4

  - name: Estrai progetto
    run: |
      unzip -o "FIRE-DOOR-MANAGER-APK (1).zip" -d progetto
      find progetto -maxdepth 3 -type f | head -100

  - name: Verifica progetto Android
    run: |
      find progetto -name gradlew -type f
      find progetto -name settings.gradle -o -name settings.gradle.kts

  - name: Crea APK
    run: |
      cd progetto
      chmod +x fdm/android/gradlew
      cd fdm/android
      ./gradlew assembleDebug

  - name: Carica APK
    uses: actions/upload-artifact@v4
    with:
      name: FIRE-DOOR-MANAGER-APK
      path: progetto/fdm/android/app/build/outputs/apk/debug/*.apk
      if-no-files-found: error
