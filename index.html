<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fire Door Manager — Offline</title>
<style>
:root{--navy:#17243a;--orange:#ed713d;--bg:#f3f5f8;--line:#e5e9ef;--muted:#718096;--green:#16845b;--red:#bd4141;--amber:#a96d13}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#202b3b;font:14px Arial,sans-serif}button,input,select,textarea{font:inherit}button{border:0;border-radius:8px;padding:10px 13px;font-weight:bold;cursor:pointer}.primary{background:var(--orange);color:#fff}.secondary{background:#eaf0f6;color:var(--navy)}.danger{background:#ffeded;color:var(--red)}
header{background:var(--navy);color:#fff;padding:17px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.brand{display:flex;align-items:center;gap:12px}.brand img{width:54px;height:54px;object-fit:cover;border-radius:12px;border:1px solid #8492a6}header h1{font-size:19px;margin:0}header small{color:#c4d0df}.wrap{max-width:1250px;margin:auto;padding:20px}
nav{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:18px}nav button{background:#fff;color:var(--navy);border:1px solid var(--line)}nav button.active{background:var(--navy);color:white}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px}.card small{color:var(--muted)}.num{font-size:27px;font-weight:bold;margin-top:7px}.panel{margin-bottom:16px}.head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}.head h2{font-size:17px;margin:0}.muted{color:var(--muted)}table{width:100%;border-collapse:collapse;min-width:650px}th,td{text-align:left;padding:11px 9px;border-bottom:1px solid var(--line)}th{font-size:11px;color:var(--muted);text-transform:uppercase}.scroll{overflow:auto}.tag{display:inline-block;padding:4px 8px;border-radius:20px;font-size:11px;font-weight:bold}.ok{background:#e5f5ed;color:var(--green)}.bad{background:#ffeded;color:var(--red)}.warn{background:#fff3dd;color:var(--amber)}.neutral{background:#edf1f6;color:#536278}
.empty{text-align:center;color:var(--muted);padding:25px}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field label{font-weight:bold;font-size:12px;color:#536176}.field input,.field select,.field textarea{border:1px solid #d7dee8;border-radius:7px;padding:10px;background:#fff;width:100%}.field textarea{min-height:75px}.modalbg{position:fixed;inset:0;background:#10182799;display:grid;place-items:center;padding:14px;z-index:5}.modal{background:white;border-radius:13px;padding:20px;width:min(760px,100%);max-height:94vh;overflow:auto}.modal h2{margin:0 0 15px;font-size:19px}.checks{display:grid;grid-template-columns:1fr 1fr;gap:8px}.check{border:1px solid var(--line);padding:9px;border-radius:8px;display:flex;justify-content:space-between;align-items:center;gap:8px}.check select{max-width:140px;padding:6px;border:1px solid var(--line);border-radius:6px}.buttons{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.notice{background:#fff5e5;border:1px solid #f3dfbd;border-radius:8px;padding:11px;font-size:12px;line-height:1.5;color:#78551c;margin:10px 0}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.toast{position:fixed;bottom:18px;right:18px;background:var(--navy);color:white;padding:12px 16px;border-radius:8px;z-index:9}.thumb{width:55px;height:44px;object-fit:cover;border-radius:6px;border:1px solid var(--line);cursor:pointer}.sigwrap{border:1px solid #cfd7e2;border-radius:8px;background:#fff;overflow:hidden}.sigpad{display:block;width:100%;height:155px;touch-action:none}.sigtools{display:flex;justify-content:space-between;align-items:center;margin:7px 0;color:var(--muted);font-size:11px}
@media(max-width:750px){.cards{grid-template-columns:1fr 1fr}.wrap{padding:12px}.form,.checks{grid-template-columns:1fr}header{padding:14px}.head{align-items:flex-start}}
@media print{header,nav,.toolbar,.no-print,button{display:none!important}body{background:white}.wrap{max-width:none;padding:0}.panel,.card{border:0}}
</style></head>
<body>
<header><div class="brand"><img src="fdm_logo.png" alt="Logo Fire Door Manager"><div><h1>FIRE DOOR MANAGER</h1><small>Gestione manutenzione porte tagliafuoco · modalità offline</small></div></div><div id="savedInfo"><small>Dati salvati su questo dispositivo</small></div></header>
<div class="wrap">
<nav id="nav">
<button class="active" data-page="home">Dashboard</button><button data-page="doors">Porte</button><button data-page="inspections">Ispezioni</button><button data-page="issues">Anomalie</button><button data-page="schedule">Scadenziario</button><button data-page="backup">Backup e impostazioni</button>
</nav>
<main id="view"></main>
</div>
<div id="modal"></div><div id="toast"></div>
<script>
if (window.AndroidPrint) { window.print = () => window.AndroidPrint.print(); }
const KEY='fdm_offline_v1';
const checklist=['Integrità anta e rivestimenti','Telaio e fissaggi','Cerniere e perni','Chiudiporta','Serratura e scrocco','Maniglione antipanico','Guarnizioni e battute','Autochiusura e accostamento','Assenza di ostacoli alla chiusura'];
let db=load(),page='home';
function fresh(){return {company:'',buildings:[],doors:[],inspections:[],issues:[]}}
function load(){try{return {...fresh(),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){return fresh()}}
function save(){localStorage.setItem(KEY,JSON.stringify(db));$('savedInfo').innerHTML='<small>✓ Salvato automaticamente · '+new Date().toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'})+'</small>'}
function $(id){return document.getElementById(id)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function date(s){return s?new Date(s+'T00:00:00').toLocaleDateString('it-IT'):'—'}
function today(){return new Date().toISOString().slice(0,10)}
function toast(s){$('toast').textContent=s;$('toast').classList.add('toast');setTimeout(()=>$('toast').className='',2600)}
function tag(s){let c=s==='Conforme'||s==='Risolta'?'ok':s==='Scaduta'||s==='Non conforme'||s==='Aperta'?'bad':s==='Da verificare'||s==='In lavorazione'?'warn':'neutral';return `<span class="tag ${c}">${esc(s||'—')}</span>`}
function door(id){return db.doors.find(d=>d.id===id)}
function doorLabel(d){return d?(d.censusCode?d.censusCode+' · ':'')+(d.code||''):'Porta eliminata'}
function building(id){return db.buildings.find(b=>b.id===id)}
function go(p){page=p;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.page));
function render(){if(page==='home')home();if(page==='doors')doorsPage();if(page==='inspections')inspectionsPage();if(page==='issues')issuesPage();if(page==='schedule')schedulePage();if(page==='backup')backupPage()}
function home(){
let overdue=db.doors.filter(d=>d.nextDue&&d.nextDue<today()).length,open=db.issues.filter(x=>x.status!=='Risolta').length;
$('view').innerHTML=`<div class="head"><div><h2>Panoramica</h2><div class="muted">Riepilogo del registro manutenzioni.</div></div><div class="toolbar"><button class="primary" onclick="doorModal()">＋ Nuova porta</button><button class="secondary" onclick="inspectionModal()">＋ Ispezione</button></div></div>
<div class="cards"><div class="card"><small>Porte censite</small><div class="num">${db.doors.length}</div></div><div class="card"><small>Scadenze superate</small><div class="num">${overdue}</div></div><div class="card"><small>Anomalie aperte</small><div class="num">${open}</div></div><div class="card"><small>Ispezioni registrate</small><div class="num">${db.inspections.length}</div></div></div>
<div class="panel"><div class="head"><h2>Ultime ispezioni</h2><button class="secondary" onclick="go('inspections')">Apri registro</button></div>${db.inspections.length?table(['Data','Codice censimento','Codice porta','Esito','Manutentore'],db.inspections.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,6).map(x=>[date(x.date),esc(door(x.doorId)?.censusCode||'—'),esc(door(x.doorId)?.code||'Porta eliminata'),tag(x.result),esc(x.technician)])):'<div class="empty">Non ci sono ancora ispezioni.</div>'}</div>
<div class="notice">I dati vengono conservati nel browser di questo dispositivo. Esporta periodicamente un backup dalla sezione “Backup e impostazioni”.</div>`;
}
function table(head,rows){return `<div class="scroll"><table><thead><tr>${head.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}

function doorsPage(){
$('view').innerHTML=`<div class="head"><div><h2>Anagrafica porte</h2><div class="muted">Elenco delle porte tagliafuoco e loro ubicazione.</div></div><button class="primary" onclick="doorModal()">＋ Aggiungi porta</button></div><div class="panel">${db.doors.length?table(['Codice censimento','Codice porta','Edificio','Ubicazione','Classe','Foto','Ultima manutenzione','Prossima scadenza','Azioni'],db.doors.map(d=>[esc(d.censusCode||'—'),`<b>${esc(d.code)}</b>`,esc(building(d.buildingId)?.name||'—'),esc(d.location),esc(d.rating),d.photo?`<img class="thumb" src="${d.photo}" onclick="viewImage('${d.photo}')">`:'—',date(d.lastDate),date(d.nextDue),`<button class="secondary" onclick="inspectionModal('${d.id}')">Ispeziona</button> <button class="secondary" onclick="doorModal('${d.id}')">Modifica</button> <button class="danger" onclick="deleteDoor('${d.id}')">Elimina</button>`])):'<div class="empty">Nessuna porta inserita.</div>'}</div>`;
}
function doorModal(id){
const old=id?door(id):null;
modal(old?'Modifica porta':'Nuova porta',`<form id="f" class="form"><div class="field"><label>Codice identificativo censimento interno</label><input name="censusCode" value="${esc(old?.censusCode||'')}" placeholder="Es. CENS-000125"></div><div class="field"><label>Codice porta *</label><input name="code" required value="${esc(old?.code||'')}" placeholder="Es. A-PT-001"></div><div class="field"><label>Edificio *</label><input name="building" required value="${esc(building(old?.buildingId)?.name||'')}" placeholder="Es. Edificio A"></div><div class="field"><label>Ubicazione *</label><input name="location" required value="${esc(old?.location||'')}" placeholder="Piano, reparto, locale"></div><div class="field"><label>Classe</label><select name="rating">${['REI 30','REI 60','REI 90','REI 120','Da verificare'].map(v=>`<option ${old?.rating===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>Tipologia</label><select name="type">${['Anta singola','Doppia anta','Altro'].map(v=>`<option ${old?.type===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>Marca / modello</label><input name="brand" value="${esc(old?.brand||'')}"></div><div class="field"><label>Ultima manutenzione</label><input type="date" name="lastDate" value="${esc(old?.lastDate||'')}"></div><div class="field"><label>Prossima scadenza</label><input type="date" name="nextDue" value="${esc(old?.nextDue||'')}"></div><div class="field full"><label>Fotografia della porta</label><input type="file" name="photoFile" accept="image/*" capture="environment" onchange="previewUpload(this,'doorPreview')"><div id="doorPreview">${old?.photo?`<img class="thumb" style="width:100px;height:75px" src="${old.photo}">`:''}</div></div><div class="field full"><label>Note</label><textarea name="notes">${esc(old?.notes||'')}</textarea></div><div class="buttons field full"><button type="button" class="secondary" onclick="closeModal()">Annulla</button><button class="primary">${old?'Salva modifiche':'Salva porta'}</button></div></form>`);
$('f').onsubmit=async e=>{e.preventDefault();let fd=new FormData(e.target),x=Object.fromEntries(fd);let uploaded=await imageFile(fd.get('photoFile'));x.photo=uploaded||(old?.photo||'');x.censusCode=(x.censusCode||'').trim();x.code=(x.code||'').trim();if(db.doors.some(d=>d.id!==id&&(d.code||'').toLowerCase()===x.code.toLowerCase()))return toast('Codice porta già presente');if(x.censusCode&&db.doors.some(d=>d.id!==id&&(d.censusCode||'').toLowerCase()===x.censusCode.toLowerCase()))return toast('Codice censimento già presente');let b=db.buildings.find(z=>z.name.toLowerCase()===x.building.toLowerCase());if(!b){b={id:uid(),name:x.building};db.buildings.push(b)}let item={id:id||uid(),censusCode:x.censusCode,code:x.code,buildingId:b.id,location:x.location,rating:x.rating,type:x.type,brand:x.brand,lastDate:x.lastDate,nextDue:x.nextDue,notes:x.notes,photo:x.photo};if(old)Object.assign(old,item);else db.doors.push(item);save();closeModal();render();toast(old?'Modifiche porta salvate':'Porta salvata')};
}

function deleteDoor(id){if(!confirm('Eliminare la porta e i relativi dati collegati?'))return;db.doors=db.doors.filter(x=>x.id!==id);db.inspections=db.inspections.filter(x=>x.doorId!==id);db.issues=db.issues.filter(x=>x.doorId!==id);save();render()}

function inspectionsPage(){$('view').innerHTML=`<div class="head"><div><h2>Registro ispezioni</h2><div class="muted">Checklist, firma grafica e storico controlli.</div></div><button class="primary" onclick="inspectionModal()">＋ Nuova ispezione</button></div><div class="panel">${db.inspections.length?table(['Data','Codice censimento','Codice porta','Esito','Manutentore','Firma','Note','Verbale PDF'],db.inspections.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(x=>[date(x.date),esc(door(x.doorId)?.censusCode||'—'),esc(door(x.doorId)?.code||'—'),tag(x.result),esc(x.technician),x.signature?`<img class="thumb" src="${x.signature}" onclick="viewImage('${x.signature}')">`:'—',esc(x.notes||'—'),`<button class="secondary" onclick="inspectionModal(null,'${x.id}')">Modifica</button> <button class="primary" onclick="printReport('${x.id}')">Crea PDF</button>`])):'<div class="empty">Nessuna ispezione registrata.</div>'}</div><div class="notice">Per ogni ispezione puoi generare un verbale singolo, pronto da stampare o salvare in PDF. Apri il verbale e scegli “Salva come PDF” nella finestra di stampa.</div>`}
function inspectionModal(id,editId){
const old=editId?db.inspections.find(i=>i.id===editId):null;
if(!db.doors.length)return toast('Inserisci prima una porta');
modal(old?'Modifica ispezione':'Registra ispezione',`<form id="f"><div class="form"><div class="field"><label>Porta *</label><select name="doorId">${db.doors.map(d=>`<option value="${d.id}" ${d.id===(old?.doorId||id)?'selected':''}>${esc(d.censusCode?d.censusCode+' · ':'')}${esc(d.code)} — ${esc(d.location)}</option>`).join('')}</select></div><div class="field"><label>Data *</label><input type="date" name="date" value="${esc(old?.date||today())}" required></div><div class="field"><label>Nome manutentore *</label><input name="technician" required value="${esc(old?.technician||'')}" placeholder="Nome e cognome"></div><div class="field"><label>Prossima scadenza</label><input type="date" name="nextDue" value="${esc(old?.nextDue||'')}"></div></div><h3>Checklist</h3><div class="checks">${checklist.map((c,i)=>`<div class="check"><span>${esc(c)}</span><select name="c${i}">${['Conforme','Non conforme','Non presente','Non verificato'].map(v=>`<option ${old?.answers?.[c]===v?'selected':''}>${v}</option>`).join('')}</select></div>`).join('')}</div><div class="field" style="margin-top:12px"><label>Firma del manutentore</label><div class="sigwrap"><canvas id="signaturePad" class="sigpad"></canvas></div><div class="sigtools"><span>Firma con dito o pennino</span><button type="button" class="secondary" onclick="clearSignature()">Cancella firma</button></div></div><div class="field" style="margin-top:12px"><label>Note / anomalie riscontrate</label><textarea name="notes">${esc(old?.notes||'')}</textarea></div><div class="buttons"><button type="button" class="secondary" onclick="closeModal()">Annulla</button><button class="primary">${old?'Salva modifiche':'Registra ispezione'}</button></div></form>`);
setupSignature();
if(old?.signature){const im=new Image();im.onload=()=>{sigCtx.drawImage(im,0,0,sigCanvas.width,sigCanvas.height);sigHasInk=true};im.src=old.signature;}
$('f').onsubmit=e=>{e.preventDefault();let fd=new FormData(e.target),answers={};checklist.forEach((c,i)=>answers[c]=fd.get('c'+i));let result=Object.values(answers).includes('Non conforme')?'Non conforme':Object.values(answers).includes('Non verificato')?'Da verificare':'Conforme';let x={id:old?.id||uid(),doorId:fd.get('doorId'),date:fd.get('date'),technician:fd.get('technician'),nextDue:fd.get('nextDue'),answers,result,notes:fd.get('notes'),signature:getSignature()||old?.signature||''};if(old)Object.assign(old,x);else db.inspections.push(x);let d=door(x.doorId);if(d){let history=db.inspections.filter(i=>i.doorId===d.id).sort((a,b)=>b.date.localeCompare(a.date));d.lastDate=history[0]?.date||'';let due=history.find(i=>i.nextDue)?.nextDue;if(due)d.nextDue=due;}if(!old&&result==='Non conforme'&&x.notes.trim())db.issues.push({id:uid(),doorId:x.doorId,description:x.notes,priority:'Ordinaria',status:'Aperta',created:today()});save();closeModal();render();toast(old?'Modifiche ispezione salvate':'Ispezione registrata')};
}


function printReport(id){
 const x=db.inspections.find(i=>i.id===id); if(!x)return toast('Ispezione non trovata');
 const d=door(x.doorId)||{}, b=building(d.buildingId)||{};
 const related=db.issues.filter(i=>i.doorId===x.doorId && (i.created===x.date || (x.result==='Non conforme' && i.description===x.notes)));
 const checklistRows=checklist.map(c=>`<tr><td>${esc(c)}</td><td>${esc(x.answers?.[c]||'Non registrato')}</td></tr>`).join('');
 const issueRows=related.length?related.map(i=>`<div class="issue"><b>${esc(i.priority||'')}</b> — ${esc(i.description||'')} ${i.status?`<span>(${esc(i.status)})</span>`:''}${i.photo?`<img class="issuephoto" src="${i.photo}">`:''}</div>`).join(''):'<p class="muted">Nessuna anomalia collegata registrata.</p>';
 const photo=d.photo?`<div class="photoBox"><b>Fotografia della porta</b><img class="doorphoto" src="${d.photo}"></div>`:'';
 const signature=x.signature?`<img class="signature" src="${x.signature}">`:'<div class="unsigned">Firma non presente</div>';
 const html=`<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verbale manutenzione ${esc(d.code||'porta')}</title><style>
 *{box-sizing:border-box}body{font:12px Arial,sans-serif;color:#202b3b;margin:0;background:#fff}.page{max-width:850px;margin:25px auto;padding:28px;border:1px solid #dfe4eb}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #17243a;padding-bottom:14px}.brand{font-size:20px;font-weight:bold;color:#17243a}.brand span{color:#ed713d}.subtitle{color:#66758a;margin-top:4px}.meta{text-align:right;color:#536176}.title{font-size:19px;margin:22px 0 14px}.section{margin:18px 0}.section h2{font-size:13px;background:#eef2f7;padding:9px;margin:0 0 8px;color:#17243a}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.cell{padding:7px;border:1px solid #e3e8ef;min-height:32px}.label{display:block;font-size:9px;text-transform:uppercase;color:#718096;margin-bottom:3px}.value{font-weight:bold}.result{display:inline-block;padding:7px 12px;border-radius:20px;font-weight:bold;background:${x.result==='Conforme'?'#e5f5ed':x.result==='Non conforme'?'#ffeded':'#fff3dd'};color:${x.result==='Conforme'?'#16845b':x.result==='Non conforme'?'#bd4141':'#a96d13'}}table{width:100%;border-collapse:collapse}th,td{border:1px solid #dfe4eb;padding:7px;text-align:left}th{background:#f4f6f9;font-size:10px}.photoBox{margin-top:12px}.doorphoto{display:block;max-width:260px;max-height:180px;object-fit:contain;margin-top:7px;border:1px solid #dfe4eb}.issue{border:1px solid #e4e8ee;padding:9px;margin:7px 0}.issuephoto{display:block;max-width:230px;max-height:150px;object-fit:contain;margin-top:7px}.notes{white-space:pre-wrap;border:1px solid #e3e8ef;padding:10px;min-height:45px}.signrow{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:25px}.signbox{border-bottom:1px solid #8491a2;min-height:80px;position:relative}.signature{max-width:220px;max-height:75px;object-fit:contain;display:block}.unsigned{color:#9a4a4a;font-style:italic;padding:20px 0}.signlabel{font-size:10px;color:#66758a;margin-top:5px}.foot{border-top:1px solid #dfe4eb;padding-top:9px;margin-top:24px;color:#718096;font-size:9px;display:flex;justify-content:space-between}.actions{text-align:center;margin:18px auto}.actions button{padding:10px 18px;border:0;border-radius:7px;background:#17243a;color:white;font-weight:bold;cursor:pointer}.muted{color:#718096}@media print{body{margin:0}.page{border:0;margin:0 auto;padding:12mm;max-width:none}.actions{display:none}@page{size:A4;margin:10mm}}
 </style></head><body><div class="actions"><button onclick="window.print()">Stampa / Salva come PDF</button></div><article class="page"><div class="top"><div><div class="brand">🔥 FIRE DOOR <span>MANAGER</span></div><div class="subtitle">Verbale di controllo e manutenzione porta tagliafuoco</div></div><div class="meta">Data intervento<br><b>${date(x.date)}</b><br>Verbale n. ${esc(String(x.id).slice(-8).toUpperCase())}</div></div>
 <h1 class="title">Rapporto di ispezione</h1><div class="section"><h2>Identificazione della porta</h2><div class="grid"><div class="cell"><span class="label">Codice identificativo censimento interno</span><span class="value">${esc(d.censusCode||'—')}</span></div><div class="cell"><span class="label">Codice porta</span><span class="value">${esc(d.code||'—')}</span></div><div class="cell"><span class="label">Edificio</span><span class="value">${esc(b.name||'—')}</span></div><div class="cell"><span class="label">Ubicazione</span><span class="value">${esc(d.location||'—')}</span></div><div class="cell"><span class="label">Classe / tipologia</span><span class="value">${esc(d.rating||'—')} · ${esc(d.type||'—')}</span></div><div class="cell"><span class="label">Marca / modello</span><span class="value">${esc(d.brand||'—')}</span></div><div class="cell"><span class="label">Prossima scadenza</span><span class="value">${date(x.nextDue||d.nextDue)}</span></div></div>${photo}</div>
 <div class="section"><h2>Esito dell'ispezione</h2><span class="result">${esc(x.result||'Da verificare')}</span></div><div class="section"><h2>Checklist di controllo</h2><table><thead><tr><th>Elemento verificato</th><th>Esito</th></tr></thead><tbody>${checklistRows}</tbody></table></div>

function issuesPage(){$('view').innerHTML=`<div class="head"><div><h2>Anomalie</h2><div class="muted">Non conformità, fotografie e azioni correttive.</div></div><button class="primary" onclick="issueModal()">＋ Nuova anomalia</button></div><div class="panel">${db.issues.length?table(['Data','Porta','Descrizione','Foto','Priorità','Stato','Azioni'],db.issues.map(x=>[date(x.created),esc(doorLabel(door(x.doorId))||'—'),esc(x.description),x.photo?`<img class="thumb" src="${x.photo}" onclick="viewImage('${x.photo}')">`:'—',esc(x.priority),tag(x.status),x.status!=='Risolta'?`<button class="secondary" onclick="issueModal('${x.id}')">Modifica</button> <button class="secondary" onclick="resolveIssue('${x.id}')">Segna risolta</button>`:`<button class="secondary" onclick="issueModal('${x.id}')">Modifica</button>`])):'<div class="empty">Nessuna anomalia registrata.</div>'}</div>`}
function issueModal(editId){const old=editId?db.issues.find(i=>i.id===editId):null;if(!db.doors.length)return toast('Inserisci prima una porta');modal(old?'Modifica anomalia':'Nuova anomalia',`<form id="f"><div class="field"><label>Porta</label><select name="doorId">${db.doors.map(d=>`<option value="${d.id}" ${old?.doorId===d.id?'selected':''}>${esc(d.censusCode?d.censusCode+' · ':'')}${esc(d.code)} — ${esc(d.location)}</option>`).join('')}</select></div><div class="field" style="margin-top:12px"><label>Descrizione *</label><textarea name="description" required>${esc(old?.description||'')}</textarea></div><div class="field" style="margin-top:12px"><label>Fotografia dell'anomalia</label><input type="file" name="photoFile" accept="image/*" capture="environment" onchange="previewUpload(this,'issuePreview')"><div id="issuePreview">${old?.photo?`<img class="thumb" style="width:100px;height:75px" src="${old.photo}">`:''}</div></div><div class="field" style="margin-top:12px"><label>Data rilevazione</label><input type="date" name="created" value="${esc(old?.created||today())}"></div><div class="field" style="margin-top:12px"><label>Priorità</label><select name="priority">${['Ordinaria','Urgente'].map(v=>`<option ${old?.priority===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field" style="margin-top:12px"><label>Stato</label><select name="status">${['Aperta','In lavorazione','Risolta'].map(v=>`<option ${old?.status===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="buttons"><button type="button" class="secondary" onclick="closeModal()">Annulla</button><button class="primary">${old?'Salva modifiche':'Salva'}</button></div></form>`);$('f').onsubmit=async e=>{e.preventDefault();let fd=new FormData(e.target),x=Object.fromEntries(fd);x.photo=(await imageFile(fd.get('photoFile')))||(old?.photo||'');delete x.photoFile;if(old)Object.assign(old,x);else db.issues.push({id:uid(),...x,status:'Aperta',created:today()});save();closeModal();render();toast(old?'Modifiche anomalia salvate':'Anomalia registrata')}}

function resolveIssue(id){let x=db.issues.find(i=>i.id===id);if(x){x.status='Risolta';x.resolved=today();save();render()}}
function schedulePage(){let list=db.doors.filter(d=>d.nextDue).sort((a,b)=>a.nextDue.localeCompare(b.nextDue));$('view').innerHTML=`<div class="head"><div><h2>Scadenziario</h2><div class="muted">Date di prossima manutenzione registrate per ogni porta.</div></div></div><div class="panel">${list.length?table(['Scadenza','Codice censimento','Codice porta','Edificio','Ubicazione','Stato'],list.map(d=>[date(d.nextDue),esc(d.censusCode||'—'),esc(d.code),esc(building(d.buildingId)?.name||'—'),esc(d.location),d.nextDue<today()?tag('Scaduta'):tag('Programmabile')])):'<div class="empty">Nessuna scadenza impostata.</div>'}</div>`}
function backupPage(){$('view').innerHTML=`<div class="head"><div><h2>Backup e impostazioni</h2><div class="muted">Esporta o ripristina i dati del gestionale.</div></div></div><div class="panel"><h3>Archivio locale</h3><p>I dati sono salvati nel browser del dispositivo. Non vengono inviati a server esterni.</p><div class="toolbar"><button class="primary" onclick="exportData()">Esporta backup JSON</button><button class="secondary" onclick="$('importFile').click()">Importa backup JSON</button><input id="importFile" type="file" accept=".json,application/json" hidden onchange="importData(event)"><button class="secondary" onclick="window.print()">Stampa / salva PDF</button></div><div class="notice">Effettua periodicamente un'esportazione JSON e conserva il file in un luogo sicuro. Se cancelli i dati del browser o cambi dispositivo, i dati locali potrebbero andare persi senza un backup.</div><hr><h3>Riepilogo archivio</h3><p>Edifici: <b>${db.buildings.length}</b> · Porte: <b>${db.doors.length}</b> · Ispezioni: <b>${db.inspections.length}</b> · Anomalie: <b>${db.issues.length}</b></p><button class="danger" onclick="clearData()">Cancella tutto l'archivio</button></div><div class="panel"><h3>Limiti della modalità offline</h3><p>Il programma può essere aperto su PC e smartphone, ma ogni dispositivo conserva un archivio separato. Non esistono sincronizzazione automatica, account personali protetti o condivisione in tempo reale. Nel campo manutentore si registra il nome della persona che esegue il controllo.</p></div>`}
function exportData(){let blob=new Blob([JSON.stringify({...db,exportedAt:new Date().toISOString(),app:'Fire Door Manager Offline'},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='fire-door-manager-backup-'+today()+'.json';a.click();URL.revokeObjectURL(a.href);toast('Backup esportato')}
function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!Array.isArray(x.doors)||!Array.isArray(x.inspections))throw Error();if(!confirm('Importare il backup? I dati attuali saranno sostituiti.'))return;db={...fresh(),...x};save();go('home');toast('Backup ripristinato')}catch(err){alert('File backup non valido.')} };r.readAsText(f);e.target.value=''}
function clearData(){if(confirm('Confermi di cancellare definitivamente tutti i dati locali? Esporta prima un backup se vuoi conservarli.')){db=fresh();save();render();toast('Archivio svuotato')}}

async function imageFile(file){
 if(!file||!file.size)return '';
 if(!file.type.startsWith('image/')){toast('Seleziona un file immagine');return ''}
 return new Promise(resolve=>{const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{const max=1280,scale=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',0.76))};img.onerror=()=>resolve('');img.src=reader.result};reader.onerror=()=>resolve('');reader.readAsDataURL(file)});
}
async function previewUpload(input,targetId){const t=$(targetId);t.innerHTML='';if(input.files&&input.files[0]){const u=await imageFile(input.files[0]);if(u)t.innerHTML=`<img class="thumb" style="width:100px;height:75px" src="${u}">`}}
function viewImage(src){modal('Immagine',`<img src="${src}" style="display:block;max-width:100%;max-height:70vh;margin:auto;border-radius:8px"><div class="buttons"><button class="secondary" onclick="closeModal()">Chiudi</button></div>`)}
let sigCanvas=null,sigCtx=null,sigDrawing=false,sigHasInk=false;
function setupSignature(){sigCanvas=$('signaturePad');if(!sigCanvas)return;sigHasInk=false;const r=sigCanvas.getBoundingClientRect(),ratio=Math.max(1,window.devicePixelRatio||1);sigCanvas.width=Math.round(r.width*ratio);sigCanvas.height=Math.round(155*ratio);sigCtx=sigCanvas.getContext('2d');sigCtx.scale(ratio,ratio);sigCtx.lineWidth=2.2;sigCtx.lineCap='round';sigCtx.lineJoin='round';sigCtx.strokeStyle='#17243a';const point=e=>{const q=sigCanvas.getBoundingClientRect();return{x:e.clientX-q.left,y:e.clientY-q.top}};sigCanvas.onpointerdown=e=>{e.preventDefault();sigDrawing=true;sigHasInk=true;sigCanvas.setPointerCapture(e.pointerId);let q=point(e);sigCtx.beginPath();sigCtx.moveTo(q.x,q.y)};sigCanvas.onpointermove=e=>{if(!sigDrawing)return;e.preventDefault();let q=point(e);sigCtx.lineTo(q.x,q.y);sigCtx.stroke()};const stop=()=>sigDrawing=false;sigCanvas.onpointerup=stop;sigCanvas.onpointercancel=stop;sigCanvas.onpointerleave=stop}
function clearSignature(){if(sigCtx&&sigCanvas){sigCtx.clearRect(0,0,sigCanvas.width,sigCanvas.height);sigHasInk=false}}
function getSignature(){return sigHasInk&&sigCanvas?sigCanvas.toDataURL('image/png'):''}

function modal(title,body){$('modal').innerHTML=`<div class="modalbg" onclick="if(event.target===this)closeModal()"><div class="modal"><h2>${title}</h2>${body}</div></div>`}
function closeModal(){$('modal').innerHTML=''}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
render();save();
</script></body></html>
